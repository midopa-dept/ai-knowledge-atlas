<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="365" viewBox="0 0 1000 365">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#344054"/></marker></defs>
<rect width="1000" height="365" fill="white"/>
<g font-family="NanumGothic, sans-serif" text-anchor="middle" fill="#182230">
<text x="230" y="42" font-size="24">원문</text><text x="230" y="76" font-size="23">민지는 책을 동생에게 돌려주었다</text>
<rect x="60" y="121" width="340" height="125" rx="8" fill="#f0f4fa" stroke="#64748b"/>
<text x="230" y="156" font-size="25">Encoder · 원문 읽기</text><text x="230" y="198" font-size="21">위치마다 벡터를 남긴다</text><text x="230" y="230" font-size="21">[위치 1] [위치 2] [위치 3] …</text>
<rect x="620" y="121" width="330" height="125" rx="8" fill="#f3f6ef" stroke="#64748b"/>
<text x="785" y="156" font-size="25">Decoder · 다음 말 만들기</text><text x="785" y="198" font-size="21">원문에서 필요한 내용을 가져온다</text><text x="785" y="230" font-size="21">다음 토큰의 확률을 계산한다</text>
<text x="510" y="152" font-size="19">원문 위치의 정보</text><text x="785" y="292" font-size="21">이미 알려진 번역문</text><text x="785" y="323" font-size="21">Minji returned …</text><text x="785" y="49" font-size="23">다음 토큰 선택</text>
</g>
<g fill="none" stroke="#344054" stroke-width="2" marker-end="url(#a)"><path d="M230 84 V118"/><path d="M400 180 H616"/><path d="M785 273 V251"/><path d="M785 118 V58"/></g>
<text x="500" y="355" text-anchor="middle" font-family="NanumGothic, sans-serif" font-size="17" fill="#344054">구조의 큰 흐름 · 다음 토큰을 고른 뒤 번역문 입력에 붙여 계산을 이어 간다</text>
</svg>
