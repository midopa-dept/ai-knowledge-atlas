<svg xmlns="http://www.w3.org/2000/svg" width="860" height="638" viewBox="0 0 860 638"><defs><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#1d4ed8"/></marker><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b45309"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="NanumGothic, sans-serif"><text x="25" y="35" font-size="26" fill="#172033">완성 원문3행과 생성 Prefix2행의 두 경로</text><rect x="25" y="75" width="350" height="70" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="37" y="104" font-size="21" fill="#172033">원문 Token → 내용 C + 위치 P</text><text x="37" y="132" font-size="21" fill="#172033">Encoder 입력 Z: 3 × 3</text><path d="M200,145 L200,180" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#b)"/><rect x="25" y="188" width="350" height="70" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="37" y="217" font-size="21" fill="#172033">Bidirectional Self → 합/LN/FFN</text><text x="37" y="245" font-size="21" fill="#172033">Encoder 반환 E: 3 × 3</text><path d="M200,258 L200,295" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#b)"/><rect x="25" y="303" width="350" height="70" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="37" y="332" font-size="21" fill="#172033">K = E W_K : 3 × 2</text><text x="37" y="360" font-size="21" fill="#172033">V = E W_V : 3 × 2</text><rect x="485" y="75" width="350" height="70" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="497" y="104" font-size="21" fill="#172033">입력 [BOS, y1] → D: 2 × 3</text><text x="497" y="132" font-size="21" fill="#172033">Target [y1, y2]는 감독</text><path d="M660,145 L660,180" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#b)"/><rect x="485" y="188" width="350" height="70" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="497" y="217" font-size="21" fill="#172033">Causal Self Q/K/V ← D</text><text x="497" y="245" font-size="21" fill="#172033">합/LN → H: 2 × 3</text><path d="M660,258 L660,295" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#b)"/><rect x="485" y="303" width="350" height="70" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="497" y="332" font-size="21" fill="#172033">Q = H W_Q : 2 × 2</text><text x="497" y="360" font-size="21" fill="#172033">요청은 Decoder의 두 행</text><path d="M200,373 L200,420" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#b)"/><path d="M660,373 L660,420" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#b)"/><rect x="25" y="428" width="810" height="70" rx="7" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="37" y="457" font-size="21" fill="#172033">Cross S/A: 2 × 3 → O: 2 × 2 → M: 2 × 3</text><text x="37" y="485" font-size="21" fill="#172033">제공3행의 집계 → 요청2행으로 반환</text><path d="M430,498 L430,530" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#b)"/><rect x="25" y="538" width="810" height="70" rx="7" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="37" y="567" font-size="21" fill="#172033">H + M → LN → U → FFN → 합/LN → Y: 2 × 3</text><text x="37" y="595" font-size="21" fill="#172033">마지막 Y행의 Token 점수는 다음 y2를 예측한다.</text></g></svg>
