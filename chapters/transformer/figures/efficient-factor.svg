<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="NanumGothic, sans-serif" fill="#172b40" font-size="19">
<text x="225" y="32" font-size="22" fill="#172b40" text-anchor="middle">직접 쌍별 Kernel</text>
<text x="685" y="32" font-size="22" fill="#172b40" text-anchor="middle">같은 Kernel의 인자 분해</text>
<rect x="55" y="65" width="340" height="90" rx="10" fill="#eaf2fb" stroke="#2463a6" stroke-width="2"/>
<text x="225.0" y="95" font-size="19" fill="#172b40" text-anchor="middle">Q 특징 n×r / K 특징 n×r</text>
<text x="225.0" y="123" font-size="19" fill="#172b40" text-anchor="middle">W = ΦQ ΦK^T : n×n</text>
<rect x="55" y="200" width="340" height="120" rx="10" fill="#eaf2fb" stroke="#2463a6" stroke-width="2"/>
<text x="225.0" y="230" font-size="19" fill="#172b40" text-anchor="middle">분모: 각 W 행의 합</text>
<text x="225.0" y="258" font-size="19" fill="#172b40" text-anchor="middle">분자: WV : n×d_v</text>
<text x="225.0" y="286" font-size="19" fill="#172b40" text-anchor="middle">같은 행 분모로 나누기</text>
<path d="M225,155 L225,200" fill="none" stroke="#2463a6" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="515" y="65" width="340" height="90" rx="10" fill="#eaf2fb" stroke="#2463a6" stroke-width="2"/>
<text x="685.0" y="95" font-size="19" fill="#172b40" text-anchor="middle">K 특징과 V를 먼저 결합</text>
<text x="685.0" y="123" font-size="19" fill="#172b40" text-anchor="middle">S = ΦK^T V : r×d_v</text>
<rect x="515" y="200" width="340" height="120" rx="10" fill="#eaf2fb" stroke="#2463a6" stroke-width="2"/>
<text x="685.0" y="230" font-size="19" fill="#172b40" text-anchor="middle">z = 제공 특징의 합 : r</text>
<text x="685.0" y="258" font-size="19" fill="#172b40" text-anchor="middle">분자 ΦQ S / 분모 ΦQ z</text>
<text x="685.0" y="286" font-size="19" fill="#172b40" text-anchor="middle">반환 n×d_v</text>
<path d="M685,155 L685,200" fill="none" stroke="#2463a6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="460" y="348" font-size="18" fill="#b94f1b" text-anchor="middle">정확한 재배치는 이 특징 Kernel에 대한 등식이다.</text>
</g></svg>
