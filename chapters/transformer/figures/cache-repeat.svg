<svg xmlns="http://www.w3.org/2000/svg" width="860" height="488" viewBox="0 0 860 488"><defs><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#1d4ed8"/></marker><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b45309"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="NanumGothic, sans-serif"><text x="25" y="35" font-size="26" fill="#172033">새 입력 처리 전: 위치0/1은 이미 두 레이어를 통과했다.</text><rect x="25" y="75" width="350" height="68" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="37" y="104" font-size="21" fill="#172033">Cache 없음: [BOS, y1, y2]</text><text x="37" y="132" font-size="21" fill="#172033">모든 위치 h0, h1, h2 다시 입력</text><rect x="485" y="75" width="350" height="68" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="497" y="104" font-size="21" fill="#172033">Cache 있음: 새 y2 한 행</text><text x="497" y="132" font-size="21" fill="#172033">위치2의 h = [1.2, 1]</text><path d="M200,143 L200,180" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#b)"/><path d="M660,143 L660,180" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#b)"/><rect x="25" y="188" width="350" height="68" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="37" y="217" font-size="21" fill="#172033">레이어1: 세 행 N/Q/K/V</text><text x="37" y="245" font-size="21" fill="#172033">세 요청 Attention/Residual/FFN</text><rect x="485" y="188" width="350" height="68" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="497" y="217" font-size="21" fill="#172033">레이어1: 새 행 N/Q/K/V</text><text x="497" y="245" font-size="21" fill="#172033">과거 K/V + 새 K/V로 한 요청</text><path d="M200,256 L200,293" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#b)"/><path d="M660,256 L660,293" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#b)"/><rect x="25" y="301" width="350" height="68" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="37" y="330" font-size="21" fill="#172033">레이어2: 세 반환을 입력</text><text x="37" y="358" font-size="21" fill="#172033">과거 두 위치 계산도 반복</text><rect x="485" y="301" width="350" height="68" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="497" y="330" font-size="21" fill="#172033">레이어2: 새 첫 반환 한 행</text><text x="497" y="358" font-size="21" fill="#172033">레이어2의 과거 K/V 재사용</text><text x="25" y="418" font-size="24" fill="#b45309">고정 계약 아래 새 마지막 반환 대응: [2.647976, 0.243786]</text><text x="25" y="458" font-size="23" fill="#172033">과거 계산 반복은 줄어도 새 Query의 세 Key 읽기는 남는다.</text></g></svg>
