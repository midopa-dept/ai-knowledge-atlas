<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430"><defs><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#1d4ed8"/></marker><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b45309"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="NanumGothic, sans-serif"><text x="25" y="35" font-size="27" fill="#172033">한 위치의 세 좌표: [1,3,5]</text><rect x="25" y="65" width="790" height="65" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="40" y="93" font-size="21" fill="#172033">μ = 3,  중심화: [-2,0,2]</text><text x="40" y="121" font-size="21" fill="#172033">σ² = (4 + 0 + 4) / 3 = 8/3</text><path d="M420,130 L420,157" fill="none" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#b)"/><rect x="25" y="165" width="790" height="65" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="40" y="193" font-size="21" fill="#172033">ε = 1/3 → 분모 sqrt(8/3 + 1/3) = sqrt(3)</text><text x="40" y="221" font-size="21" fill="#172033">z = [-2/sqrt(3), 0, 2/sqrt(3)]</text><path d="M420,230 L420,256" fill="none" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#b)"/><rect x="25" y="264" width="790" height="65" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="40" y="292" font-size="21" fill="#172033">γ = [2,1,0.5],  β = [1,-1,2]</text><text x="40" y="320" font-size="21" fill="#172033">LN = [1-4/sqrt(3), -1, 2+1/sqrt(3)]</text><text x="25" y="369" font-size="23" fill="#172033">이 통계에는 다른 위치/다른 Batch의 좌표가 들어오지 않는다.</text><text x="25" y="405" font-size="23" fill="#172033">z 분산 = 8/9   |   γ/β 이후 평균은 약 0.089316</text></g></svg>
