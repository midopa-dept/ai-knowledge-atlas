<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"><rect width="100%" height="100%" fill="white"/><g font-family="NanumGothic, sans-serif"><text x="30" y="30" font-size="23" fill="#1f2937" text-anchor="start">같은 비교 좌표를 곱하고 더한다</text><rect x="30" y="60" width="270" height="105" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="46" y="90" font-size="19" fill="#1f2937" text-anchor="start">둘째 질의 q = [0, 1]</text><text x="46" y="120" font-size="19" fill="#1f2937" text-anchor="start">셋째 키 k = [1, 1]</text><text x="46" y="148" font-size="19" fill="#1f2937" text-anchor="start">0 × 1 + 1 × 1 = 1</text><text x="332" y="124" font-size="35" fill="#1f2937" text-anchor="start">→</text><text x="450" y="62" font-size="18" fill="#1f2937" text-anchor="start">제공 위치 j</text><text x="469" y="91" font-size="18" fill="#1f2937" text-anchor="middle">1</text><text x="551" y="91" font-size="18" fill="#1f2937" text-anchor="middle">2</text><text x="633" y="91" font-size="18" fill="#1f2937" text-anchor="middle">3</text><text x="360" y="140" font-size="17" fill="#1f2937" text-anchor="start">질의 1</text><rect x="435" y="108" width="68" height="52" rx="8" fill="#f8fafc" stroke="#64748b"/><text x="469" y="142" font-size="22" fill="#1f2937" text-anchor="middle">1</text><rect x="517" y="108" width="68" height="52" rx="8" fill="#f8fafc" stroke="#64748b"/><text x="551" y="142" font-size="22" fill="#1f2937" text-anchor="middle">0</text><rect x="599" y="108" width="68" height="52" rx="8" fill="#f8fafc" stroke="#64748b"/><text x="633" y="142" font-size="22" fill="#1f2937" text-anchor="middle">1</text><text x="360" y="208" font-size="17" fill="#1f2937" text-anchor="start">질의 2</text><rect x="435" y="176" width="68" height="52" rx="8" fill="#f8fafc" stroke="#64748b"/><text x="469" y="210" font-size="22" fill="#1f2937" text-anchor="middle">0</text><rect x="517" y="176" width="68" height="52" rx="8" fill="#f8fafc" stroke="#64748b"/><text x="551" y="210" font-size="22" fill="#1f2937" text-anchor="middle">1</text><rect x="599" y="176" width="68" height="52" rx="8" fill="#dbeafe" stroke="#64748b"/><text x="633" y="210" font-size="22" fill="#1f2937" text-anchor="middle">1</text><text x="30" y="270" font-size="20" fill="#1f2937" text-anchor="start">Q: 2 × 2    K: 3 × 2    K^T: 2 × 3    D: 2 × 3</text><text x="30" y="307" font-size="18" fill="#1f2937" text-anchor="start">한 셀은 한 질의·키의 점수다. 값 좌표는 아직 사용하지 않는다.</text></g></svg>
