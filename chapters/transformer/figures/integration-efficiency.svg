<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450">
<defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#445566"/></marker></defs>
<rect width="900" height="450" fill="white"/>
<text x="450" y="33" font-family="NanumGothic" font-size="22" text-anchor="middle" fill="#152738">비용을 줄이는 서로 다른 세 지점</text>
<rect x="25" y="90" width="250" height="190" rx="8" fill="#eff6ff" stroke="#7499ba" stroke-width="2"/>
<text x="150.0" y="119" font-family="NanumGothic" font-size="18" text-anchor="middle" fill="#152738">KV Cache</text>
<text x="150.0" y="144" font-family="NanumGothic" font-size="18" text-anchor="middle" fill="#152738">과거 표현/투영 재계산 감소</text>
<text x="150.0" y="169" font-family="NanumGothic" font-size="18" text-anchor="middle" fill="#152738">원 Full 계수 정의 유지</text>
<text x="150.0" y="194" font-family="NanumGothic" font-size="18" text-anchor="middle" fill="#152738">새 Query의 과거 읽기 유지</text>
<rect x="325" y="90" width="250" height="190" rx="8" fill="#eff6ff" stroke="#7499ba" stroke-width="2"/>
<text x="450.0" y="119" font-family="NanumGothic" font-size="18" text-anchor="middle" fill="#152738">Local Causal</text>
<text x="450.0" y="144" font-family="NanumGothic" font-size="18" text-anchor="middle" fill="#152738">허용15쌍 → 9쌍</text>
<text x="450.0" y="169" font-family="NanumGothic" font-size="18" text-anchor="middle" fill="#152738">먼 직접 연결6개 생략</text>
<text x="450.0" y="194" font-family="NanumGothic" font-size="18" text-anchor="middle" fill="#152738">남긴 열의 Softmax 재정규화</text>
<rect x="625" y="90" width="250" height="190" rx="8" fill="#eff6ff" stroke="#7499ba" stroke-width="2"/>
<text x="750.0" y="119" font-family="NanumGothic" font-size="18" text-anchor="middle" fill="#152738">별도 특징 Kernel</text>
<text x="750.0" y="144" font-family="NanumGothic" font-size="18" text-anchor="middle" fill="#152738">과거 제공 집합 유지</text>
<text x="750.0" y="169" font-family="NanumGothic" font-size="18" text-anchor="middle" fill="#152738">계수 정의 변경</text>
<text x="750.0" y="194" font-family="NanumGothic" font-size="18" text-anchor="middle" fill="#152738">직접 합 = S/z 인자 합</text>
<text x="450" y="398" font-family="NanumGothic" font-size="17" text-anchor="middle" fill="#152738">Full / Local / Kernel의 출력은 이 실험에서 서로 다름</text>
<text x="450" y="423" font-family="NanumGothic" font-size="17" text-anchor="middle" fill="#152738">좌표 곱셈 셈과 CPU/GPU 시간·모델 성능은 별도 검증</text>
