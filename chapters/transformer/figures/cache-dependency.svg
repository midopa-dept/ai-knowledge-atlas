<svg xmlns="http://www.w3.org/2000/svg" width="860" height="546" viewBox="0 0 860 546"><defs><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#1d4ed8"/></marker><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b45309"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="NanumGothic, sans-serif"><text x="25" y="35" font-size="26" fill="#172033">첫 W_Q 변경이 상위 Cache에 도달하는 경로</text><rect x="25" y="75" width="350" height="68" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="37" y="104" font-size="21" fill="#172033">첫 입력 h → N1 → z</text><text x="37" y="132" font-size="21" fill="#172033">고정 z·W_K/W_V → 첫 K/V</text><rect x="485" y="75" width="350" height="68" rx="7" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="497" y="104" font-size="21" fill="#172033">첫 입력 h → N1 → z</text><text x="497" y="132" font-size="21" fill="#172033">바뀐 W_Q → 새 Query</text><path d="M200,143 L200,180" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#b)"/><path d="M660,143 L660,180" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#o)"/><rect x="25" y="188" width="810" height="68" rx="7" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="37" y="217" font-size="21" fill="#172033">같은 K/V라도 Query 변화 → 점수/비율/집계 변화 가능</text><text x="37" y="245" font-size="21" fill="#172033">위치0은 Key 하나라 비율1 유지. 여러 Key는 추가 확인.</text><path d="M430,256 L430,288" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#o)"/><rect x="25" y="296" width="810" height="68" rx="7" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="37" y="325" font-size="21" fill="#172033">C/W_O → Residual → N2/FFN → 첫 반환</text><text x="37" y="353" font-size="21" fill="#172033">첫 K/V 보존과 첫 반환 보존은 다른 판단</text><path d="M430,364 L430,398" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#o)"/><rect x="25" y="406" width="810" height="68" rx="7" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="37" y="435" font-size="21" fill="#172033">첫 반환 → 둘째 N1 → 둘째 Head별 K/V</text><text x="37" y="463" font-size="21" fill="#172033">변경이 전달된 위치마다 둘째 생성원을 확인한다.</text><text x="25" y="518" font-size="23" fill="#172033">Token 변경: 첫 K/V의 해당 위치 → 뒤 요청 집계 → 상위 입력</text></g></svg>
