<svg xmlns="http://www.w3.org/2000/svg" width="860" height="557" viewBox="0 0 860 557"><defs><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#1d4ed8"/></marker><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b45309"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="NanumGothic, sans-serif"><text x="25" y="35" font-size="26" fill="#172033">조건부 생성: 둘 다 유효할 수 있지만 출처 경로는 다르다.</text><rect x="25" y="75" width="810" height="70" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="37" y="104" font-size="21" fill="#172033">Decoder-only: [지시, x1, x2, x3, SEP, BOS, y1]</text><text x="37" y="132" font-size="21" fill="#172033">하나의 스택: Self Q/K/V ← 같은 시퀀스</text><path d="M430,145 L430,175" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#b)"/><rect x="25" y="183" width="810" height="65" rx="7" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="37" y="212" font-size="21" fill="#172033">마지막 y1 요청은 앞의 조건 전체 + 출력 Prefix를 읽는다.</text><text x="37" y="240" font-size="21" fill="#172033">기본 Causal에서는 x1의 표현이 x2/x3를 읽지 못한다.</text><rect x="25" y="303" width="350" height="70" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="37" y="332" font-size="21" fill="#172033">Encoder: [x1, x2, x3]</text><text x="37" y="360" font-size="21" fill="#172033">각 E행은 완성 조건 전체 접근</text><rect x="485" y="303" width="350" height="70" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="497" y="332" font-size="21" fill="#172033">Decoder: [BOS, y1]</text><text x="497" y="360" font-size="21" fill="#172033">Self는 Causal Prefix 접근</text><path d="M200,373 L200,407" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#b)"/><path d="M660,373 L660,407" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#b)"/><rect x="25" y="415" width="810" height="70" rx="7" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="37" y="444" font-size="21" fill="#172033">Cross K/V ← E, Q ← Decoder Self 이후 H</text><text x="37" y="472" font-size="21" fill="#172033">Decoder 마지막 행에서 다음 Token 예측</text><text x="25" y="530" font-size="23" fill="#172033">같은 과제 수행 가능성은 같은 내부 표현/비용/성능의 보장이 아니다.</text></g></svg>
