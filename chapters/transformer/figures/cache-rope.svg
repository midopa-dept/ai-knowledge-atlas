<svg xmlns="http://www.w3.org/2000/svg" width="860" height="477" viewBox="0 0 860 477"><defs><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#1d4ed8"/></marker><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b45309"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="NanumGothic, sans-serif"><text x="25" y="35" font-size="26" fill="#172033">회전 전 Key [1,0], 주파수 theta = pi/2</text><rect x="25" y="75" width="255" height="68" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="37" y="104" font-size="21" fill="#172033">위치0: 회전0</text><text x="37" y="132" font-size="21" fill="#172033">회전 후 K = [1,0]</text><path d="M150,143 L150,175" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#b)"/><rect x="25" y="183" width="255" height="42" rx="7" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="37" y="212" font-size="21" fill="#172033">V: 직접 회전 없음</text><rect x="310" y="75" width="255" height="68" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="322" y="104" font-size="21" fill="#172033">위치1: 반시계90도</text><text x="322" y="132" font-size="21" fill="#172033">회전 후 K = [0,1]</text><path d="M435,143 L435,175" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#b)"/><rect x="310" y="183" width="255" height="42" rx="7" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="322" y="212" font-size="21" fill="#172033">V: 직접 회전 없음</text><rect x="595" y="75" width="255" height="68" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="607" y="104" font-size="21" fill="#172033">위치2: 반시계180도</text><text x="607" y="132" font-size="21" fill="#172033">회전 후 K = [-1,0]</text><path d="M720,143 L720,175" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#b)"/><rect x="595" y="183" width="255" height="42" rx="7" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="607" y="212" font-size="21" fill="#172033">V: 직접 회전 없음</text><text x="25" y="276" font-size="24" fill="#172033">위치1 → 2: 회전 후 K는 새 좌표로 변환해야 한다.</text><rect x="25" y="310" width="810" height="96" rx="7" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="37" y="339" font-size="21" fill="#172033">첫 Q/K 회전 변경 → 점수/집계 변경 가능</text><text x="37" y="367" font-size="21" fill="#172033">첫 Block 반환 → 둘째 N/투영 입력 변경 가능</text><text x="37" y="395" font-size="21" fill="#172033">따라서 상위 V는 다시 생성원을 확인한다.</text><text x="25" y="449" font-size="23" fill="#172033">회전 전 저장도 원위치와 바탕 표현의 유효성을 함께 보존한다.</text></g></svg>
