<svg xmlns="http://www.w3.org/2000/svg" width="860" height="375" viewBox="0 0 860 375"><defs><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#1d4ed8"/></marker><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b45309"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="NanumGothic, sans-serif"><text x="25" y="35" font-size="26" fill="#172033">입력은 알려진 토큰, Target는 다음 정답</text><rect x="25" y="75" width="255" height="66" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="37" y="104" font-size="21" fill="#172033">입력 행 0: BOS</text><text x="37" y="132" font-size="21" fill="#172033">허용: BOS</text><path d="M150,141 L150,177" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#b)"/><rect x="25" y="185" width="255" height="70" rx="7" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="37" y="214" font-size="21" fill="#172033">반환 행 0</text><text x="37" y="242" font-size="21" fill="#172033">Target: y1</text><rect x="310" y="75" width="255" height="66" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="322" y="104" font-size="21" fill="#172033">입력 행 1: y1</text><text x="322" y="132" font-size="21" fill="#172033">허용: BOS, y1</text><path d="M435,141 L435,177" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#b)"/><rect x="310" y="185" width="255" height="70" rx="7" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="322" y="214" font-size="21" fill="#172033">반환 행 1</text><text x="322" y="242" font-size="21" fill="#172033">Target: y2</text><rect x="595" y="75" width="255" height="66" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="607" y="104" font-size="21" fill="#172033">입력 행 2: y2</text><text x="607" y="132" font-size="21" fill="#172033">허용: BOS, y1, y2</text><path d="M720,141 L720,177" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#b)"/><rect x="595" y="185" width="255" height="70" rx="7" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="607" y="214" font-size="21" fill="#172033">반환 행 2</text><text x="607" y="242" font-size="21" fill="#172033">Target: y3</text><text x="25" y="305" font-size="24" fill="#172033">행1은 입력 y1을 읽고 y2를 예측한다.</text><text x="25" y="343" font-size="22" fill="#b45309">입력 행2의 y2 → 행1은 금지. 대각선 y1 → 행1은 허용.</text></g></svg>
