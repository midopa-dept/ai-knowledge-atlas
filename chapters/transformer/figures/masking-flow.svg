<svg xmlns="http://www.w3.org/2000/svg" width="750" height="595" viewBox="0 0 750 595"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="NanumGothic, sans-serif"><text x="20" y="30" font-size="23" fill="#1f2937" text-anchor="start">점수와 권한을 따로 구성한 뒤 허용 위치만 집계한다</text><rect x="20" y="65" width="310" height="85" rx="7" fill="#eff6ff" stroke="#64748b"/><text x="35" y="94" font-size="19" fill="#1f2937" text-anchor="start">Q: 3 × 1     K: 3 × 1</text><text x="35" y="124" font-size="19" fill="#1f2937" text-anchor="start">S의 각 행 = [0, ln2, ln3]</text><rect x="380" y="65" width="340" height="85" rx="7" fill="#ecfdf5" stroke="#64748b"/><text x="395" y="94" font-size="19" fill="#1f2937" text-anchor="start">원래 위치 + 실제 키 여부</text><text x="395" y="124" font-size="19" fill="#1f2937" text-anchor="start">B: 3 × 3,  True = 허용</text><path d="M180,151 L270,208" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M550,151 L480,208" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="100" y="210" width="520" height="135" rx="7" fill="#ecfdf5" stroke="#64748b"/><text x="115" y="239" font-size="19" fill="#1f2937" text-anchor="start">각 질의의 허용 열만 Softmax</text><text x="115" y="270" font-size="19" fill="#1f2937" text-anchor="start">J0 = {0}       → A0 = [1, 0, 0]</text><text x="115" y="300" font-size="19" fill="#1f2937" text-anchor="start">J1 = {0, 1}   → A1 = [1/3, 2/3, 0]</text><text x="115" y="330" font-size="19" fill="#1f2937" text-anchor="start">J2 = {0, 1, 2} → A2 = [1/6, 1/3, 1/2]</text><rect x="20" y="395" width="210" height="65" rx="7" fill="#f8fafc" stroke="#64748b"/><text x="35" y="424" font-size="19" fill="#1f2937" text-anchor="start">V: 3 × 2</text><text x="35" y="448" font-size="19" fill="#1f2937" text-anchor="start">값의 출처는 K와 대응</text><path d="M230,426 L300,426" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M410,345 L410,395" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="300" y="395" width="420" height="100" rx="7" fill="#eff6ff" stroke="#64748b"/><text x="315" y="423" font-size="19" fill="#1f2937" text-anchor="start">O = AV: 3 × 2</text><text x="315" y="452" font-size="19" fill="#1f2937" text-anchor="start">[2,0], [2/3,4], [19/3,8]</text><text x="315" y="480" font-size="19" fill="#1f2937" text-anchor="start">다음 위치의 예측 계산으로 전달</text><text x="20" y="535" font-size="20" fill="#1f2937" text-anchor="start">입력 BOS / y1 / y2    →    예측 대상 y1 / y2 / y3</text><text x="20" y="572" font-size="19" fill="#1f2937" text-anchor="start">빈 유효 행: 오류     패딩 질의: 정규화 생략·출력0</text></g></svg>
