<svg xmlns="http://www.w3.org/2000/svg" width="790" height="647" viewBox="0 0 790 647"><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#1d4ed8"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b45309"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="NanumGothic, sans-serif"><text x="20" y="32" font-size="25" fill="#1d4ed8" text-anchor="start">Cross 요청0: h0 → q0 = [1, 0]</text><text x="20" y="70" font-size="21" fill="#172033" text-anchor="start">Q의 출처 H, 비교 폭2: 내적을 √2로 나눈다.</text><text x="20" y="112" font-size="21" fill="#b45309" text-anchor="start">Z의 제공 위치</text><rect x="20" y="135" width="230" height="105" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="35" y="168" font-size="20" fill="#b45309" text-anchor="start">위치0: v0 = [2, 0]</text><text x="35" y="200" font-size="21" fill="#172033" text-anchor="start">s00 = ln2</text><text x="35" y="228" font-size="21" fill="#172033" text-anchor="start">A00 = 2/5</text><path d="M130,242 L130,275" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#orange)"/><rect x="20" y="280" width="230" height="66" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="35" y="321" font-size="23" fill="#b45309" text-anchor="start">[4/5, 0]</text><rect x="270" y="135" width="230" height="105" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="285" y="168" font-size="20" fill="#b45309" text-anchor="start">위치1: v1 = [0, 3]</text><text x="285" y="200" font-size="21" fill="#172033" text-anchor="start">s01 = 0</text><text x="285" y="228" font-size="21" fill="#172033" text-anchor="start">A01 = 1/5</text><path d="M380,242 L380,275" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#orange)"/><rect x="270" y="280" width="230" height="66" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="285" y="321" font-size="23" fill="#b45309" text-anchor="start">[0, 3/5]</text><rect x="520" y="135" width="230" height="105" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="535" y="168" font-size="20" fill="#b45309" text-anchor="start">위치2: v2 = [2, 3]</text><text x="535" y="200" font-size="21" fill="#172033" text-anchor="start">s02 = ln2</text><text x="535" y="228" font-size="21" fill="#172033" text-anchor="start">A02 = 2/5</text><path d="M630,242 L630,275" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#orange)"/><rect x="520" y="280" width="230" height="66" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="535" y="321" font-size="23" fill="#b45309" text-anchor="start">[4/5, 6/5]</text><text x="20" y="386" font-size="22" fill="#172033" text-anchor="start">허용 세 열의 지수 [2, 1, 2], 분모5 → 값별 기여를 더한다.</text><path d="M385,398 L385,421" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#orange)"/><rect x="70" y="425" width="640" height="80" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="90" y="457" font-size="25" fill="#1d4ed8" text-anchor="start">o0 = [8/5, 9/5] = [1.6, 1.8]</text><text x="90" y="488" font-size="20" fill="#1d4ed8" text-anchor="start">이 한 행은 Z의 위치가 아니라 H의 요청0으로 돌아간다.</text><text x="20" y="546" font-size="22" fill="#172033" text-anchor="start">다른 제공 위치1·2의 합 = [4/5, 9/5]</text><text x="20" y="582" font-size="22" fill="#172033" text-anchor="start">예시 R 적용: o0 R = [8/5, 9/5, -1/5]</text><text x="20" y="618" font-size="23" fill="#1d4ed8" text-anchor="start">h0 + o0 R = [13/5, 9/5, 4/5]</text></g></svg>
