<svg xmlns="http://www.w3.org/2000/svg" width="840" height="465" viewBox="0 0 840 465"><defs><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#1d4ed8"/></marker><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b45309"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="NanumGothic, sans-serif"><text x="25" y="35" font-size="27" fill="#172033">동일 매개변수 · 다른 입력 · 위치별 계산</text><rect x="25" y="65" width="790" height="112" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="40" y="93" font-size="21" fill="#172033">x = [1,-1,2] → z = x W₁ + b₁ = [3,-2.5,-2,1.5]</text><text x="40" y="121" font-size="21" fill="#172033">ReLU(z) = [3,0,0,1.5]</text><text x="40" y="149" font-size="21" fill="#172033">f = h W₂ + b₂ = [0.85,-0.2,-0.45]</text><rect x="25" y="225" width="790" height="112" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="40" y="253" font-size="21" fill="#172033">x = [-1,2,0] → z = x W₁ + b₁ = [-1,2.5,3,-3.5]</text><text x="40" y="281" font-size="21" fill="#172033">ReLU(z) = [0,2.5,3,0]</text><text x="40" y="309" font-size="21" fill="#172033">f = h W₂ + b₂ = [1.6,-0.45,1.55]</text><text x="25" y="400" font-size="22" fill="#172033">각 행: 3 → 4 → 3 특징 폭. 두 행 사이에는 직접 화살표가 없다.</text><text x="25" y="440" font-size="23" fill="#172033">Batch 벡터화도 마지막 특징 축만 변환한다.</text></g></svg>
