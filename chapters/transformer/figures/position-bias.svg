<svg xmlns="http://www.w3.org/2000/svg" width="840" height="492" viewBox="0 0 840 492"><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#1d4ed8"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b45309"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="NanumGothic, sans-serif"><text x="20" y="33" font-size="26" fill="#172033">요청0: 같은 내용 점수에 상대 위치별 편향을 더한다</text><text x="25" y="85" font-size="22" fill="#172033">키 위치</text><text x="180" y="85" font-size="22" fill="#172033">delta = pQ-pK</text><text x="435" y="85" font-size="22" fill="#172033">편향</text><text x="640" y="85" font-size="22" fill="#172033">새 점수</text><text x="30" y="132" font-size="22" fill="#172033">0</text><text x="245" y="132" font-size="22" fill="#172033">0</text><text x="435" y="132" font-size="22" fill="#172033">0</text><text x="640" y="132" font-size="22" fill="#172033">ln2</text><text x="30" y="177" font-size="22" fill="#172033">1</text><text x="245" y="177" font-size="22" fill="#172033">-1</text><text x="435" y="177" font-size="22" fill="#172033">ln2</text><text x="640" y="177" font-size="22" fill="#172033">2 ln2</text><text x="30" y="222" font-size="22" fill="#172033">2</text><text x="245" y="222" font-size="22" fill="#172033">-2</text><text x="435" y="222" font-size="22" fill="#172033">-ln2</text><text x="640" y="222" font-size="22" fill="#172033">0</text><text x="20" y="269" font-size="23" fill="#172033">원점수는 각 열 ln2, 요청 위치 pQ=0</text><path d="M420,282 L420,315" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#orange)"/><rect x="20" y="322" width="800" height="93" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="40" y="360" font-size="24" fill="#172033">exp(S) = [2,4,1] → A = [2/7,4/7,1/7]</text><text x="40" y="395" font-size="24" fill="#172033">O = (2/7)2 + (4/7)5 + (1/7)8 = 32/7</text><text x="20" y="461" font-size="22" fill="#172033">편향은 scale 뒤 더한다. 음수 편향도 접근 금지는 아니다.</text></g></svg>
