<svg xmlns="http://www.w3.org/2000/svg" width="840" height="695" viewBox="0 0 840 695"><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#1d4ed8"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b45309"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="NanumGothic, sans-serif"><text x="20" y="32" font-size="26" fill="#172033">Head2의 요청1: 한 행 전체 계산</text><rect x="20" y="58" width="800" height="65" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="40" y="98" font-size="24" fill="#172033">x1 = [0,1] → q = 1   |   비교 폭 1, scale = 1</text><text x="25" y="163" font-size="23" fill="#172033">제공 위치</text><text x="220" y="163" font-size="23" fill="#172033">키 k</text><text x="385" y="163" font-size="23" fill="#172033">점수 s</text><text x="570" y="163" font-size="23" fill="#172033">값 v</text><text x="25" y="208" font-size="23" fill="#172033">0: [1,0]</text><text x="220" y="208" font-size="23" fill="#172033">0</text><text x="385" y="208" font-size="23" fill="#172033">0</text><text x="570" y="208" font-size="23" fill="#172033">-1</text><text x="25" y="252" font-size="23" fill="#172033">1: [0,1]</text><text x="220" y="252" font-size="23" fill="#172033">ln3</text><text x="385" y="252" font-size="23" fill="#172033">ln3</text><text x="570" y="252" font-size="23" fill="#172033">3</text><text x="25" y="296" font-size="23" fill="#172033">2: [1,-1]</text><text x="220" y="296" font-size="23" fill="#172033">-ln3</text><text x="385" y="296" font-size="23" fill="#172033">-ln3</text><text x="570" y="296" font-size="23" fill="#172033">-4</text><path d="M420,318 L420,350" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#orange)"/><rect x="20" y="355" width="800" height="92" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="40" y="392" font-size="24" fill="#172033">모두 허용: exp(s) = [1, 3, 1/3]</text><text x="40" y="428" font-size="24" fill="#172033">A2의 행1 = [3/13, 9/13, 1/13]</text><path d="M420,447 L420,480" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#orange)"/><rect x="20" y="485" width="800" height="93" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="40" y="522" font-size="24" fill="#172033">값의 기여: -3/13 + 27/13 - 4/13</text><text x="40" y="558" font-size="24" fill="#172033">O2의 행1 = 20/13  (3 × 1 출력의 한 행)</text><text x="20" y="625" font-size="22" fill="#172033">s = QK^T / sqrt(1), a = 허용 열 Softmax, o = a @ v</text><text x="20" y="667" font-size="22" fill="#172033">금지 열이 있으면 그 열은 지수·분모·집계에서 제외한다.</text></g></svg>
