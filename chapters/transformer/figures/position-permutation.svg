<svg xmlns="http://www.w3.org/2000/svg" width="840" height="435" viewBox="0 0 840 435"><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#1d4ed8"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b45309"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="NanumGothic, sans-serif"><text x="20" y="33" font-size="26" fill="#172033">위치 신호 없이 내용 행을 옮기면 출력도 따라간다</text><rect x="20" y="65" width="335" height="170" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="40" y="103" font-size="23" fill="#172033">원래 X = [[1,0],[2,0]]</text><text x="40" y="143" font-size="22" fill="#172033">S = ln2 × [[1,2],[2,4]]</text><text x="40" y="184" font-size="24" fill="#172033">O = [10/3, 18/5]^T</text><rect x="485" y="65" width="335" height="170" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="505" y="103" font-size="23" fill="#172033">PX = [[2,0],[1,0]]</text><text x="505" y="143" font-size="22" fill="#172033">S&#x27; = ln2 × [[4,2],[2,1]]</text><text x="505" y="184" font-size="24" fill="#172033">O&#x27; = [18/5, 10/3]^T</text><path d="M355,145 L480,145" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#orange)"/><text x="365" y="126" font-size="22" fill="#172033">교환</text><rect x="20" y="280" width="800" height="83" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="40" y="313" font-size="23" fill="#172033">Q&#x27;=PQ, K&#x27;=PK, V&#x27;=PV</text><text x="40" y="345" font-size="24" fill="#172033">A&#x27;=P A P^T → O&#x27;=P O</text><text x="20" y="405" font-size="22" fill="#172033">조건: 모든 열 허용 · 같은 위치별 투영 · 별도 위치 신호 없음</text></g></svg>
