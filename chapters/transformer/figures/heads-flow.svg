<svg xmlns="http://www.w3.org/2000/svg" width="840" height="758" viewBox="0 0 840 758"><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#1d4ed8"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b45309"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="NanumGothic, sans-serif"><text x="20" y="32" font-size="26" fill="#172033">같은 입력, 두 투영·집계, 하나의 최종 표현</text><rect x="205" y="60" width="430" height="70" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="225" y="90" font-size="25" fill="#172033">X (x): 3 × 2</text><text x="225" y="118" font-size="23" fill="#172033">[[1,0], [0,1], [1,-1]]</text><path d="M330,130 L205,182" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#blue)"/><path d="M510,130 L640,182" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#orange)"/><rect x="20" y="187" width="375" height="180" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="38" y="220" font-size="24" fill="#1d4ed8">Head1: WQ / WK / WV</text><text x="38" y="252" font-size="21" fill="#172033">각 W: 2 × 1  →  Q/K/V: 3 × 1</text><text x="38" y="284" font-size="21" fill="#172033">S / A: 3 × 3 (모든 열 허용)</text><text x="38" y="316" font-size="22" fill="#172033">O1 = [7/5, 4/3, 7/5]^T</text><text x="38" y="350" font-size="20" fill="#172033">trace: q, k, v, s, a, o</text><rect x="445" y="187" width="375" height="180" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="463" y="220" font-size="23" fill="#b45309">Head2: 별도 WQ / WK / WV</text><text x="463" y="252" font-size="21" fill="#172033">각 W: 2 × 1  →  Q/K/V: 3 × 1</text><text x="463" y="284" font-size="21" fill="#172033">S / A: 3 × 3 (모든 열 허용)</text><text x="463" y="316" font-size="21" fill="#172033">O2 = [-2/3, 20/13, -36/13]^T</text><text x="463" y="350" font-size="20" fill="#172033">trace: q, k, v, s, a, o</text><path d="M205,367 L320,420" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#blue)"/><path d="M640,367 L520,420" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#orange)"/><rect x="145" y="425" width="550" height="77" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="162" y="459" font-size="25" fill="#172033">C (c): 3 × 2 = [O1 | O2]</text><text x="162" y="489" font-size="22" fill="#172033">행은 같은 요청, 열은 Head별 값 좌표</text><path d="M420,502 L420,535" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#blue)"/><rect x="145" y="540" width="550" height="77" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="162" y="573" font-size="23" fill="#172033">WO (wo): 2 × 2 = [[1,2],[-1,1]]</text><text x="162" y="601" font-size="24" fill="#172033">Y (y) = C WO: 3 × 2</text><path d="M420,617 L420,650" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#blue)"/><text x="170" y="686" font-size="24" fill="#172033">세 요청의 표현 → 다음 Block 처리</text><text x="20" y="730" font-size="22" fill="#172033">Cross: Q는 H, K/V는 Z. 출력 행은 H의 요청 위치다.</text></g></svg>
