<svg xmlns="http://www.w3.org/2000/svg" width="840" height="658" viewBox="0 0 840 658"><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#1d4ed8"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b45309"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="NanumGothic, sans-serif"><text x="20" y="32" font-size="26" fill="#172033">요청0: Concat은 좌표 보존, WO는 좌표 혼합</text><rect x="20" y="65" width="335" height="82" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="40" y="99" font-size="24" fill="#1d4ed8">Head1: o1 = 7/5</text><text x="40" y="133" font-size="22" fill="#172033">값 좌표 1개</text><rect x="485" y="65" width="335" height="82" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="505" y="99" font-size="24" fill="#b45309">Head2: o2 = -2/3</text><text x="505" y="133" font-size="22" fill="#172033">값 좌표 1개</text><path d="M187,147 L322,196" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#blue)"/><path d="M652,147 L520,196" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#orange)"/><rect x="150" y="202" width="540" height="70" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="175" y="244" font-size="27" fill="#172033">c0 = [7/5 | -2/3]  (1 × 2)</text><path d="M420,272 L420,308" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#blue)"/><rect x="150" y="314" width="540" height="75" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="175" y="346" font-size="22" fill="#172033">wo의 첫 행: [1,2] ← Head1 좌표</text><text x="175" y="377" font-size="22" fill="#172033">wo의 둘째 행: [-1,1] ← Head2 좌표</text><path d="M300,389 L220,431" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#blue)"/><path d="M540,389 L625,431" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#orange)"/><rect x="20" y="437" width="375" height="95" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="40" y="475" font-size="23" fill="#172033">첫 출력: 7/5 - (-2/3)</text><text x="40" y="510" font-size="25" fill="#1d4ed8">= 31/15</text><rect x="445" y="437" width="375" height="95" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="465" y="475" font-size="23" fill="#172033">둘째: 2(7/5) + (-2/3)</text><text x="465" y="510" font-size="25" fill="#b45309">= 32/15</text><text x="20" y="583" font-size="25" fill="#172033">y0 = [31/15,32/15]  |  Y 전체: 3 × 2</text><text x="20" y="629" font-size="22" fill="#172033">Head 순서를 바꾸면 대응하는 wo의 행도 함께 옮긴다.</text></g></svg>
