<svg xmlns="http://www.w3.org/2000/svg" width="800" height="665" viewBox="0 0 800 665"><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#1d4ed8"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b45309"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="NanumGothic, sans-serif"><text x="20" y="32" font-size="25" fill="#172033" text-anchor="start">Self: 같은 X에서 요청·제공 → X의 위치로 반환</text><rect x="20" y="65" width="155" height="92" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="35" y="98" font-size="21" fill="#172033" text-anchor="start">X: 3 × 2</text><text x="35" y="132" font-size="21" fill="#172033" text-anchor="start">세 위치</text><rect x="230" y="65" width="205" height="92" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="245" y="98" font-size="21" fill="#172033" text-anchor="start">각각 투영</text><text x="245" y="132" font-size="21" fill="#172033" text-anchor="start">Q / K / V</text><path d="M175,110 L225,110" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#blue)"/><path d="M435,110 L480,110" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#blue)"/><rect x="485" y="65" width="285" height="92" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="500" y="98" font-size="21" fill="#172033" text-anchor="start">S / A: 3 × 3</text><text x="500" y="132" font-size="21" fill="#172033" text-anchor="start">각 요청이 X의 값을 집계</text><path d="M630,157 L630,195" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#blue)"/><rect x="230" y="200" width="540" height="65" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="245" y="240" font-size="21" fill="#172033" text-anchor="start">O: 3 × 2  →  예시 X + O: 3 × 2</text><text x="20" y="305" font-size="25" fill="#172033" text-anchor="start">Cross: H가 요청, Z가 조건 제공 → H로 반환</text><rect x="20" y="340" width="155" height="76" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="35" y="371" font-size="21" fill="#172033" text-anchor="start">H: 2 × 3</text><text x="35" y="401" font-size="21" fill="#172033" text-anchor="start">두 요청</text><rect x="235" y="340" width="200" height="76" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="250" y="371" font-size="21" fill="#172033" text-anchor="start">WQ: 3 × 2</text><text x="250" y="401" font-size="21" fill="#172033" text-anchor="start">Q: 2 × 2</text><path d="M175,378 L230,378" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#blue)"/><rect x="20" y="465" width="155" height="90" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="35" y="499" font-size="21" fill="#b45309" text-anchor="start">Z: 3 × 2</text><text x="35" y="531" font-size="21" fill="#b45309" text-anchor="start">세 제공 위치</text><rect x="235" y="465" width="200" height="90" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="250" y="499" font-size="21" fill="#b45309" text-anchor="start">WK / WV</text><text x="250" y="531" font-size="21" fill="#b45309" text-anchor="start">K / V: 3 × 2</text><path d="M175,510 L230,510" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#orange)"/><rect x="490" y="340" width="280" height="105" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="505" y="371" font-size="21" fill="#172033" text-anchor="start">S / A: 2 × 3</text><text x="505" y="401" font-size="21" fill="#172033" text-anchor="start">O = AV: 2 × 2</text><text x="505" y="431" font-size="19" fill="#172033" text-anchor="start">행은 H, 합하는 열은 Z</text><path d="M435,378 L485,378" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#blue)"/><path d="M435,505 L555,450" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#orange)"/><path d="M635,445 L635,485" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#blue)"/><rect x="490" y="490" width="280" height="65" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="505" y="529" font-size="21" fill="#172033" text-anchor="start">H + OR: 2 × 3</text><text x="20" y="603" font-size="20" fill="#172033" text-anchor="start">R: 2 × 3은 반환 폭을 맞춘다. Z의 새 표현은 직접 반환하지 않는다.</text><text x="20" y="639" font-size="20" fill="#172033" text-anchor="start">접근 제약 B: Self는 X–X 쌍, Cross는 H–Z 쌍에 적용한다.</text></g></svg>
