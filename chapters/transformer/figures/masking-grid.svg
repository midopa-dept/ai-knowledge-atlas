<svg xmlns="http://www.w3.org/2000/svg" width="720" height="602" viewBox="0 0 720 602"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="NanumGothic, sans-serif"><text x="20" y="30" font-size="23" fill="#1f2937" text-anchor="start">질의 행1: 입력 y1로 대상 y2를 예측한다</text><text x="270" y="69" font-size="20" fill="#1f2937" text-anchor="start">키 배열 열 j</text><text x="318" y="100" font-size="18" fill="#1f2937" text-anchor="middle">열0</text><text x="318" y="130" font-size="18" fill="#1f2937" text-anchor="middle">원래 위치2</text><text x="318" y="158" font-size="19" fill="#1f2937" text-anchor="middle">y2</text><text x="453" y="100" font-size="18" fill="#1f2937" text-anchor="middle">열1</text><text x="453" y="130" font-size="18" fill="#1f2937" text-anchor="middle">원래 위치0</text><text x="453" y="158" font-size="19" fill="#1f2937" text-anchor="middle">BOS</text><text x="588" y="100" font-size="18" fill="#1f2937" text-anchor="middle">열2</text><text x="588" y="130" font-size="18" fill="#1f2937" text-anchor="middle">원래 위치1</text><text x="588" y="158" font-size="19" fill="#1f2937" text-anchor="middle">y1</text><text x="20" y="206" font-size="18" fill="#1f2937" text-anchor="start">질의 행0</text><text x="20" y="232" font-size="17" fill="#1f2937" text-anchor="start">원래 위치0 → 대상1</text><rect x="270" y="182" width="96" height="56" rx="7" fill="#f1f5f9" stroke="#64748b"/><text x="318" y="218" font-size="24" fill="#1f2937" text-anchor="middle">0</text><rect x="405" y="182" width="96" height="56" rx="7" fill="#d1fae5" stroke="#64748b"/><text x="453" y="218" font-size="24" fill="#1f2937" text-anchor="middle">1</text><rect x="540" y="182" width="96" height="56" rx="7" fill="#f1f5f9" stroke="#64748b"/><text x="588" y="218" font-size="24" fill="#1f2937" text-anchor="middle">0</text><text x="20" y="282" font-size="18" fill="#1f2937" text-anchor="start">질의 행1</text><text x="20" y="308" font-size="17" fill="#1f2937" text-anchor="start">원래 위치1 → 대상2</text><rect x="270" y="258" width="96" height="56" rx="7" fill="#f1f5f9" stroke="#64748b"/><text x="318" y="294" font-size="24" fill="#1f2937" text-anchor="middle">0</text><rect x="405" y="258" width="96" height="56" rx="7" fill="#d1fae5" stroke="#64748b"/><text x="453" y="294" font-size="24" fill="#1f2937" text-anchor="middle">1</text><rect x="540" y="258" width="96" height="56" rx="7" fill="#d1fae5" stroke="#64748b"/><text x="588" y="294" font-size="24" fill="#1f2937" text-anchor="middle">1</text><text x="20" y="358" font-size="18" fill="#1f2937" text-anchor="start">질의 행2</text><text x="20" y="384" font-size="17" fill="#1f2937" text-anchor="start">원래 위치2 → 대상3</text><rect x="270" y="334" width="96" height="56" rx="7" fill="#d1fae5" stroke="#64748b"/><text x="318" y="370" font-size="24" fill="#1f2937" text-anchor="middle">1</text><rect x="405" y="334" width="96" height="56" rx="7" fill="#d1fae5" stroke="#64748b"/><text x="453" y="370" font-size="24" fill="#1f2937" text-anchor="middle">1</text><rect x="540" y="334" width="96" height="56" rx="7" fill="#d1fae5" stroke="#64748b"/><text x="588" y="370" font-size="24" fill="#1f2937" text-anchor="middle">1</text><text x="20" y="445" font-size="20" fill="#b91c1c" text-anchor="start">행1의 잘못된 tril: [1, 1, 0]</text><text x="20" y="477" font-size="19" fill="#b91c1c" text-anchor="start">열0 (위치2·정답) → 출력 → y2 예측: 누출</text><text x="20" y="511" font-size="19" fill="#047857" text-anchor="start">수정: [0, 1, 1]  →  미래 열0 차단·과거 열2 복구</text><text x="20" y="545" font-size="18" fill="#1f2937" text-anchor="start">열0/1/2의 V도 위치2/0/1에 맞춰 함께 옮긴다.</text><text x="20" y="579" font-size="18" fill="#1f2937" text-anchor="start">초록1 = 허용, 회색0 = 차단. 표는 수정 후 전체 Mask다.</text></g></svg>
