<svg xmlns="http://www.w3.org/2000/svg" width="840" height="532" viewBox="0 0 840 532"><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#1d4ed8"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b45309"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="NanumGothic, sans-serif"><text x="20" y="33" font-size="25" fill="#172033">같은 내용 q=k=[1,0], 요청 각도0과 키의 상대각</text><text x="85" y="88" font-size="23" fill="#172033">키 각도 0도</text><path d="M35,230 L255,230 M145,330 L145,120" stroke="#94a3b8" stroke-width="1.4"/><text x="247" y="252" font-size="18" fill="#172033">x</text><text x="153" y="129" font-size="18" fill="#172033">y</text><path d="M145,230 L235,230" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#blue)"/><path d="M145,230 L235,230" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#orange)"/><text x="71" y="370" font-size="22" fill="#172033">내적 분자 = 1</text><text x="360" y="88" font-size="23" fill="#172033">키 각도 90도</text><path d="M310,230 L530,230 M420,330 L420,120" stroke="#94a3b8" stroke-width="1.4"/><text x="522" y="252" font-size="18" fill="#172033">x</text><text x="428" y="129" font-size="18" fill="#172033">y</text><path d="M420,230 L510,230" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#blue)"/><path d="M420,230 L420,140" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#orange)"/><text x="346" y="370" font-size="22" fill="#172033">내적 분자 = 0</text><path d="M480,230 A60,60 0 0,0 420,170" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#orange)"/><text x="635" y="88" font-size="23" fill="#172033">키 각도 180도</text><path d="M585,230 L805,230 M695,330 L695,120" stroke="#94a3b8" stroke-width="1.4"/><text x="797" y="252" font-size="18" fill="#172033">x</text><text x="703" y="129" font-size="18" fill="#172033">y</text><path d="M695,230 L785,230" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#blue)"/><path d="M695,230 L605,230" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#orange)"/><text x="621" y="370" font-size="22" fill="#172033">내적 분자 = -1</text><path d="M755,230 A60,60 0 0,0 635,230" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#orange)"/><text x="20" y="419" font-size="22" fill="#172033">파랑 q: [1,0] 고정 · 주황 k: 반시계 회전 (0도에서는 겹침)</text><text x="20" y="458" font-size="23" fill="#172033">상대각 = 키 각도 - 요청 각도 = (pK-pQ) theta</text><text x="20" y="500" font-size="22" fill="#172033">두 벡터의 길이는1로 유지되지만 서로 다른 회전은 내적을 바꾼다.</text></g></svg>
