<svg xmlns="http://www.w3.org/2000/svg" width="850" height="625" viewBox="0 0 850 625"><defs><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#1d4ed8"/></marker><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b45309"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="NanumGothic, sans-serif"><text x="25" y="32" font-size="26" fill="#172033">하위 함수가 읽는 가지와 기존 표현을 잇는 경로</text><text x="25" y="72" font-size="25" fill="#172033">Post-LN</text><rect x="105" y="92" width="290" height="40" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="120" y="120" font-size="21" fill="#172033">입력 X: n × d</text><path d="M250,132 L250,158" fill="none" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#b)"/><rect x="105" y="165" width="290" height="68" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="120" y="193" font-size="21" fill="#172033">MHA(X)</text><text x="120" y="221" font-size="21" fill="#172033">M: n × d</text><polyline points="105,112 45,112 45,268 105,268" fill="none" stroke="#b45309" stroke-width="2.4" marker-end="url(#o)"/><text x="12" y="200" font-size="24" fill="#b45309">X</text><path d="M250,233 L250,248" fill="none" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#b)"/><rect x="105" y="252" width="290" height="40" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="120" y="280" font-size="21" fill="#172033">첫 합 R₁ = X + M</text><path d="M250,292 L250,313" fill="none" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#b)"/><rect x="105" y="320" width="290" height="40" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="120" y="348" font-size="21" fill="#172033">LN₁(R₁) → U</text><path d="M250,360 L250,378" fill="none" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#b)"/><rect x="105" y="385" width="290" height="40" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="120" y="413" font-size="21" fill="#172033">FFN(U) → F</text><polyline points="105,340 45,340 45,460 105,460" fill="none" stroke="#b45309" stroke-width="2.4" marker-end="url(#o)"/><text x="12" y="404" font-size="24" fill="#b45309">U</text><path d="M250,425 L250,442" fill="none" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#b)"/><rect x="105" y="448" width="290" height="40" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="120" y="476" font-size="21" fill="#172033">둘째 합 R₂ = U + F</text><path d="M250,488 L250,508" fill="none" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#b)"/><rect x="105" y="515" width="290" height="40" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="120" y="543" font-size="21" fill="#172033">LN₂(R₂) → 반환 Y</text><text x="455" y="72" font-size="25" fill="#172033">Pre-LN</text><rect x="535" y="92" width="290" height="40" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="550" y="120" font-size="21" fill="#172033">입력 X: n × d</text><path d="M680,132 L680,158" fill="none" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#b)"/><rect x="535" y="165" width="290" height="68" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="550" y="193" font-size="21" fill="#172033">LN₁(X) → MHA</text><text x="550" y="221" font-size="21" fill="#172033">M: n × d</text><polyline points="535,112 475,112 475,268 535,268" fill="none" stroke="#b45309" stroke-width="2.4" marker-end="url(#o)"/><text x="442" y="200" font-size="24" fill="#b45309">X</text><path d="M680,233 L680,248" fill="none" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#b)"/><rect x="535" y="252" width="290" height="40" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="550" y="280" font-size="21" fill="#172033">첫 합 U = X + M</text><path d="M680,292 L680,318" fill="none" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#b)"/><rect x="535" y="325" width="290" height="68" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="550" y="353" font-size="21" fill="#172033">LN₂(U) → FFN</text><text x="550" y="381" font-size="21" fill="#172033">F: n × d</text><polyline points="535,272 475,272 475,428 535,428" fill="none" stroke="#b45309" stroke-width="2.4" marker-end="url(#o)"/><text x="442" y="360" font-size="24" fill="#b45309">U</text><path d="M680,393 L680,411" fill="none" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#b)"/><rect x="535" y="415" width="290" height="40" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="550" y="443" font-size="21" fill="#172033">반환 Y = U + F</text><text x="455" y="494" font-size="20" fill="#172033">추가 최종 LN은 이 Block에 없다.</text><text x="25" y="602" font-size="22" fill="#172033">파랑: 하위 연산/정규화    주황: 기존 표현과 반환의 Residual 합</text></g></svg>
