<svg xmlns="http://www.w3.org/2000/svg" width="730" height="565" viewBox="0 0 730 565"><rect width="100%" height="100%" fill="white"/><g font-family="NanumGothic, sans-serif"><text x="25" y="30" font-size="23" fill="#1f2937" text-anchor="start">비교에서 집계까지 — 같은 두 질의와 세 제공 위치</text><rect x="25" y="58" width="680" height="84" rx="8" fill="#f8fafc" stroke="#64748b"/><text x="42" y="85" font-size="20" fill="#1f2937" text-anchor="start">D = QK^T</text><text x="305" y="85" font-size="18" fill="#1f2937" text-anchor="start">[1, 0, 1]</text><text x="305" y="115" font-size="18" fill="#1f2937" text-anchor="start">[0, 1, 1]</text><text x="42" y="115" font-size="17" fill="#1f2937" text-anchor="start">2 × 3</text><text x="365" y="163" font-size="25" fill="#1f2937" text-anchor="middle">↓</text><rect x="25" y="165" width="680" height="84" rx="8" fill="#f8fafc" stroke="#64748b"/><text x="42" y="192" font-size="20" fill="#1f2937" text-anchor="start">S = D / √2</text><text x="305" y="192" font-size="18" fill="#1f2937" text-anchor="start">[0.707, 0, 0.707]</text><text x="305" y="222" font-size="18" fill="#1f2937" text-anchor="start">[0, 0.707, 0.707]</text><text x="42" y="222" font-size="17" fill="#1f2937" text-anchor="start">2 × 3</text><text x="365" y="270" font-size="25" fill="#1f2937" text-anchor="middle">↓</text><rect x="25" y="272" width="680" height="84" rx="8" fill="#eff6ff" stroke="#64748b"/><text x="42" y="299" font-size="20" fill="#1f2937" text-anchor="start">A = 행별 Softmax</text><text x="305" y="299" font-size="18" fill="#1f2937" text-anchor="start">[0.401, 0.198, 0.401]</text><text x="305" y="329" font-size="18" fill="#1f2937" text-anchor="start">[0.198, 0.401, 0.401]</text><text x="42" y="329" font-size="17" fill="#1f2937" text-anchor="start">2 × 3</text><text x="365" y="377" font-size="25" fill="#1f2937" text-anchor="middle">↓</text><rect x="25" y="379" width="680" height="84" rx="8" fill="#f8fafc" stroke="#64748b"/><text x="42" y="406" font-size="20" fill="#1f2937" text-anchor="start">O = AV</text><text x="305" y="406" font-size="18" fill="#1f2937" text-anchor="start">[1.604, 2.396]</text><text x="305" y="436" font-size="18" fill="#1f2937" text-anchor="start">[1.198, 3.209]</text><text x="42" y="436" font-size="17" fill="#1f2937" text-anchor="start">2 × 2</text><text x="25" y="506" font-size="20" fill="#1f2937" text-anchor="start">V = [[2, 0], [0, 4], [2, 4]]   (3 × 2)</text><text x="25" y="541" font-size="19" fill="#1f2937" text-anchor="start">QK^T: 비교 좌표 합     AV: 제공 위치의 기여 합</text></g></svg>
