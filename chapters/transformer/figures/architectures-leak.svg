<svg xmlns="http://www.w3.org/2000/svg" width="860" height="557" viewBox="0 0 860 557"><defs><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#1d4ed8"/></marker><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b45309"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="NanumGothic, sans-serif"><text x="25" y="35" font-size="26" fill="#172033">금지 열 차단 뒤에도 남을 수 있는 입력 생성 우회 경로</text><rect x="25" y="75" width="810" height="66" rx="7" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="37" y="104" font-size="21" fill="#172033">미래 입력 D2 → 전체 평균(D0,D1,D2)</text><text x="37" y="132" font-size="21" fill="#172033">전체 평균을 초기 D0에 더하면 이미 미래를 포함한다.</text><path d="M430,141 L430,173" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#o)"/><rect x="25" y="181" width="810" height="66" rx="7" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="37" y="210" font-size="21" fill="#172033">오염된 초기 행0 → Q/K/V 또는 Residual 직접 경로</text><text x="37" y="238" font-size="21" fill="#172033">Causal Mask가 키 열2를 막아도 자기 행0의 오염은 남는다.</text><path d="M430,247 L430,277" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#o)"/><rect x="25" y="285" width="810" height="42" rx="7" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="37" y="314" font-size="21" fill="#172033">행별 후속 함수 → 예측 Y0에 금지 정보 도달 가능</text><rect x="25" y="376" width="810" height="66" rx="7" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="37" y="405" font-size="21" fill="#172033">다른 경로: 미래 원문2 → 전체 Encoder → E0</text><text x="37" y="433" font-size="21" fill="#172033">Cross가 E0만 읽어도 그 E0가 미래를 포함할 수 있다.</text><text x="25" y="490" font-size="23" fill="#1d4ed8">수정: 초기 표현/조건 제공자의 의존성부터 가용 정보 안으로 제한</text><text x="25" y="530" font-size="23" fill="#1d4ed8">검사: 미래 변경 불변 + 허용 과거/조건 변경의 양성 대조</text></g></svg>
